name: PSP Spring Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  psp-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PSP (Spring)
        uses: research-projects-all/Pedagogical-SAST-Profile-PSP@v1.0.0
        with:
          framework: spring
          output-format: sarif
          output-file: psp-spring-results.sarif
          fail-on-finding: false

      - name: Upload to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: psp-spring-results.sarif
          category: psp-spring
