name: Pedagogical Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  psp-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: research-projects-all/Pedagogical-SAST-Profile-PSP@v1.0.1
        with:
          framework: django
          output-format: sarif
          output-file: psp-results.sarif
          fail-on-finding: false

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: psp-results.sarif
          category: psp-django
