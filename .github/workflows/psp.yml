name: Pedagogical Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write   # Required to upload SARIF to GitHub Code Scanning
  actions: read

jobs:
  psp-scan:
    runs-on: ubuntu-latest
    name: Scan tutorial code with PSP

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Pedagogical SAST Profile
        uses: research-projects-all/Pedagogical-SAST-Profile-PSP@v1.0.0
        with:
          framework: both          # Options: django | spring | both
          scan-path: '.'             # Scan entire repo (default)
          output-format: sarif       # Required for GitHub Code Scanning
          output-file: psp-results.sarif
          fail-on-finding: false     # Set 'true' to block builds on ERROR severity

      - name: Upload results to GitHub Code Scanning
        if: always()               # Upload even if previous step found issues
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: psp-results.sarif
          category: pedagogical-sast-profile
